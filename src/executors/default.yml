description: CircleCI's cimg/base docker image. An optimized Ubuntu environment for CI.

parameters:
  tag:
    description: >
      The cimg/base image tag, e.g. "stable", "current", or "edge". A digest can be appended
      to pin the exact image, e.g. "stable@sha256:<digest>".
    type: string
    default: "stable"

docker:
  - image: cimg/base:<<parameters.tag>>
